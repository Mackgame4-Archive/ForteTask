services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_PORT: ${APP_PORT:-3000}
        DATABASE_URL: postgresql://${POSTGRES_USER:-fortetask}:${POSTGRES_PASSWORD:-fortetask_password}@postgres:5432/${POSTGRES_DB:-fortetask}
    container_name: fortetask-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-http://localhost:3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-fortetask}:${POSTGRES_PASSWORD:-fortetask_password}@postgres:5432/${POSTGRES_DB:-fortetask}
      USE_HTTPS: ${USE_HTTPS:-false}
      POSTGRES_DB: ${POSTGRES_DB:-fortetask}
      POSTGRES_USER: ${POSTGRES_USER:-fortetask}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fortetask_password}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:17-alpine
    container_name: fortetask-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fortetask}
      POSTGRES_USER: ${POSTGRES_USER:-fortetask}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fortetask_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fortetask} -d ${POSTGRES_DB:-fortetask}"]
      interval: 10s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    container_name: fortetask-caddy
    profiles:
      - https
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_URL: ${APP_URL:-localhost}
    command: caddy reverse-proxy --from ${APP_URL:-localhost} --to app:3000
    volumes:
      - caddy_data:/data
      - caddy_data:/config
    depends_on:
      - app

volumes:
  postgres_data:
  caddy_data:
